<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14">
  <rect width="760" height="250" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Un neurone = une suite de MAC (multiplication-accumulation)</text>
  <g font-size="14">
    <rect x="30" y="60" width="90" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="75" y="82" text-anchor="middle">x₁ (int8)</text>
    <rect x="30" y="104" width="90" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="75" y="126" text-anchor="middle">x₂ (int8)</text>
    <rect x="30" y="148" width="90" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="75" y="170" text-anchor="middle">xₙ (int8)</text>
    <rect x="150" y="60" width="90" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="195" y="82" text-anchor="middle">w₁ (int8)</text>
    <rect x="150" y="104" width="90" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="195" y="126" text-anchor="middle">w₂ (int8)</text>
    <rect x="150" y="148" width="90" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/><text x="195" y="170" text-anchor="middle">wₙ (int8)</text>
    <circle cx="300" cy="77" r="16" fill="#fde68a" stroke="#d97706"/><text x="300" y="82" text-anchor="middle">×</text>
    <circle cx="300" cy="121" r="16" fill="#fde68a" stroke="#d97706"/><text x="300" y="126" text-anchor="middle">×</text>
    <circle cx="300" cy="165" r="16" fill="#fde68a" stroke="#d97706"/><text x="300" y="170" text-anchor="middle">×</text>
    <path d="M316 77 L390 118 M316 121 L390 121 M316 165 L390 124" stroke="#6b7280" fill="none"/>
    <circle cx="410" cy="121" r="20" fill="#fde68a" stroke="#d97706"/><text x="410" y="127" text-anchor="middle" font-size="18">Σ</text>
    <text x="410" y="165" text-anchor="middle" fill="#6b7280">accumulateur</text>
    <text x="410" y="182" text-anchor="middle" fill="#6b7280">int32 (+ biais)</text>
    <path d="M430 121 L480 121" stroke="#6b7280" marker-end="url(#a)"/>
    <rect x="482" y="98" width="120" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="542" y="118" text-anchor="middle">Remise à</text><text x="542" y="135" text-anchor="middle">l'échelle → int8</text>
    <path d="M602 121 L640 121" stroke="#6b7280" marker-end="url(#a)"/>
    <rect x="642" y="98" width="90" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="687" y="118" text-anchor="middle">ReLU6</text><text x="687" y="135" text-anchor="middle">→ sortie</text>
  </g>
  <text x="380" y="225" text-anchor="middle" fill="#374151">Le CPU fait ces MAC un par un. Le NPU en fait des centaines à chaque cycle, en parallèle.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs>
</svg>

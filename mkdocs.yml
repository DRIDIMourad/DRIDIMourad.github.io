site_name: Mourad DRIDI
site_url: https://dridimourad.github.io/
site_description: Mourad DRIDI, enseignant-chercheur à ESIEE Paris (DISC) et au LIGM (équipe LRT)
copyright: © Mourad DRIDI

theme:
  name: material
  custom_dir: overrides
  language: fr
  logo: assets/avatar.jpg
  favicon: assets/avatar.jpg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs          # onglets "Recherche" / "Enseignements" en haut
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/sections.css

extra_javascript:
  - javascripts/sections.js

extra:
  social:
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=CFmoyZIAAAAJ&hl=fr
      name: Google Scholar
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mourad-dridi-285862a8/
      name: LinkedIn
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/profile/Mourad-Dridi/research
      name: ResearchGate
    - icon: material/email
      link: mailto:mourad.dridi@univ-eiffel.fr
      name: E-mail

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Recherche:
      - research/index.md
      - NPSIM: research/npsim.md
      - Projets: research/projets.md
      - Stages encadrés: research/encadrement.md
  - Enseignements:
      - units/index.md
      - IA embarquée:
          - units/ia-embarquee/index.md
          - TPs:
              - units/ia-embarquee/tp/index.md
              - "TP1 : Classification d'images sur NPU": units/ia-embarquee/tp/tp1/index.md
              - "TP2 : Entraîner son modèle avec eIQ Portal": units/ia-embarquee/tp/tp2/index.md
              - "TP3 : Détecter un feu sur le NPU": units/ia-embarquee/tp/tp3/index.md
          - Projets:
              - units/ia-embarquee/projet/index.md
              - "Projet 1 : Flotte de drones de détection d'accidents": units/ia-embarquee/projet/projet1/index.md
      - "3R-TR1 · Physique pour la transition énergétique":
          - units/3r-tr1/index.md
          - Cours:
              - units/3r-tr1/cours/index.md
              - "CM1 : Systèmes de numération et arithmétique binaire": units/3r-tr1/cours/cm1/index.md
